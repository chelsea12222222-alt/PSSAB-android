name: Build PSSAB AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP Android project tidak ditemukan"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)
          if [ -z "$ROOT" ]; then
            echo "Folder proyek Android tidak ditemukan di dalam ZIP"
            exit 1
          fi
          cp -a "$ROOT"/. ./
          rm -rf extracted "$ZIP_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build AAB
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pssab-tanjung-uncang-aab
          path: app/build/outputs/bundle/release/app-release.aab
